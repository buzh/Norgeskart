# Cache for the Kartverket LiDAR hillshade WMS. 25 GB LRU on disk;
# ~800k keys metadata in shared memory (roughly enough for 25 GB @ ~30 KB/tile).
proxy_cache_path /var/cache/nginx/wms
    levels=1:2
    keys_zone=wms:100m
    max_size=25g
    inactive=180d
    use_temp_path=off;

# Skip caching for responses under 1000 bytes. Real hillshade tiles are
# 5–50 KB. Server-dropped "blank" responses are ~479 bytes; legit no-coverage
# tiles are also ~479 bytes. Bypassing both is fine — refetching a 479-byte
# response is cheap, and it prevents a bad response from poisoning the cache.
map $upstream_http_content_length $skip_cache {
    default        0;
    ""             1;
    "~^[0-9]{1,3}$" 1;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=30s;

    location /skwms1/wms.hoyde-dtm-nhm-topobathy-25833 {
        # Use a variable so nginx re-resolves the upstream hostname via
        # docker DNS rather than pinning at startup.
        set $wms_upstream https://wms.geonorge.no;
        proxy_pass $wms_upstream$request_uri;

        proxy_set_header Host wms.geonorge.no;
        proxy_ssl_server_name on;
        # Trust the upstream — this is a fixed public Kartverket endpoint.
        proxy_ssl_verify off;

        proxy_cache wms;
        proxy_cache_valid 200 180d;
        # Only one upstream request at a time per key while a miss is in
        # flight — prevents thundering herd on a cold cache.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_no_cache $skip_cache;
        proxy_cache_bypass $skip_cache;

        # Upstream sends Set-Cookie (JSESSIONID) which would normally block
        # caching, and no Cache-Control. Ignore both.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Powered-By;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;

        add_header X-Cache-Status $upstream_cache_status always;
    }
}
