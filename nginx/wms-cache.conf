# Cache for the Kartverket LiDAR hillshade WMS. 25 GB LRU on disk;
# 100m keys_zone ≈ ~800k entries (roughly enough for 25 GB @ ~30 KB/tile).
proxy_cache_path /var/cache/nginx/wms
    levels=1:2
    keys_zone=wms:100m
    max_size=25g
    inactive=180d
    use_temp_path=off;

# Skip caching for responses under 1000 bytes. Real hillshade tiles are
# 5–50 KB. Server-dropped "blank" responses are ~479 bytes; legit
# no-coverage tiles are also ~479 bytes. Bypassing both is fine — refetching
# a 479-byte response is cheap, and it prevents a bad response from
# poisoning the cache.
map $upstream_http_content_length $skip_cache {
    default         0;
    ""              1;
    "~^[0-9]{1,3}$" 1;
}

upstream wms_upstream {
    server wms.geonorge.no:443;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    location /skwms1/wms.hoyde-dtm-nhm-topobathy-25833 {
        include /etc/nginx/wms-proxy-common.conf;
    }

    # Per-project LiDAR (per-acquisition DTM). Serves both GetMap tiles and
    # GetCapabilities. Capabilities responses are cached the same 180 days as
    # tiles — new lidar projects appear rarely, and the browser can bust our
    # cache by varying a query param when it wants fresher data.
    location /skwms1/wms.hoyde-dtm-prosjekt {
        include /etc/nginx/wms-proxy-common.conf;
    }
}
