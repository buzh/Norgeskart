# Cache for the Kartverket LiDAR hillshade WMS. 25 GB LRU on disk;
# 100m keys_zone ≈ ~800k entries (roughly enough for 25 GB @ ~30 KB/tile).
proxy_cache_path /var/cache/nginx/wms
    levels=1:2
    keys_zone=wms:100m
    max_size=25g
    inactive=180d
    use_temp_path=off;

# Skip caching for responses under 1000 bytes. Real hillshade tiles are
# 5–50 KB. Server-dropped "blank" responses are ~479 bytes; legit
# no-coverage tiles are also ~479 bytes. Bypassing both is fine — refetching
# a 479-byte response is cheap, and it prevents a bad response from
# poisoning the cache.
map $upstream_http_content_length $skip_cache {
    default         0;
    ""              1;
    "~^[0-9]{1,3}$" 1;
}

upstream wms_upstream {
    server wms.geonorge.no:443;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    location /skwms1/wms.hoyde-dtm-nhm-topobathy-25833 {
        proxy_pass https://wms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host wms.geonorge.no;
        proxy_set_header Connection "";
        # Some CDN/WAF fronts inspect these — pass real client info through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name wms.geonorge.no;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_cache wms;
        proxy_cache_valid 200 180d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_no_cache $skip_cache;
        proxy_cache_bypass $skip_cache;

        # Upstream sends Set-Cookie (JSESSIONID) which would block caching,
        # and no Cache-Control. Ignore both.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Powered-By;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;

        add_header X-Cache-Status $upstream_cache_status always;
    }
}
