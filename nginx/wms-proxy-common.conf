# Shared proxy + cache setup for Kartverket WMS endpoints proxied through
# wmscache. Included from each location in wms-cache.conf.

proxy_pass https://wms_upstream;
proxy_http_version 1.1;
proxy_set_header Host wms.geonorge.no;
proxy_set_header Connection "";
# Force upstream to send uncompressed. Kartverket's per-project WMS otherwise
# returns gzipped + chunked responses with NO Content-Length header, which
# trips the small-response guard below ($upstream_http_content_length == "")
# and prevents caching entirely. PNG bodies are already binary-compressed;
# gzipping them on the wire saves ~nothing anyway.
proxy_set_header Accept-Encoding "";
# Some CDN/WAF fronts inspect these — pass real client info through.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_ssl_server_name on;
proxy_ssl_name wms.geonorge.no;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

proxy_cache wms;
proxy_cache_valid 200 180d;
proxy_cache_lock on;
proxy_cache_lock_timeout 30s;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
proxy_no_cache $skip_cache;
# Do NOT set proxy_cache_bypass $skip_cache — that directive is evaluated
# at request time, when $upstream_http_content_length is still empty, so
# the map would fire on every request and we'd never serve from cache.
# proxy_no_cache alone is enough to keep small responses out of the cache.

# Upstream sends Set-Cookie (JSESSIONID) which would block caching,
# and no Cache-Control. Ignore both.
proxy_ignore_headers Set-Cookie Cache-Control Expires;
proxy_hide_header Set-Cookie;
proxy_hide_header X-Powered-By;

proxy_connect_timeout 10s;
proxy_read_timeout 30s;
proxy_send_timeout 10s;

add_header X-Cache-Status $upstream_cache_status always;
